<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secured Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #33ff33;
      --black: #000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--green);
      overflow: hidden;
      font-family: "Share Tech Mono", ui-monospace, monospace;
    }

    canvas#matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px 40px;
    }

    .hero-copy {
      opacity: 0;
      transform: scale(0.86) translateZ(0);
      filter: blur(12px);
      transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.16,1,.3,1), filter .9s ease;
    }

    body.is-ready .hero-copy {
      opacity: 1;
      transform: none;
      filter: none;
    }

    h1 {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(42px, 8.4vw, 132px);
      line-height: .9;
      letter-spacing: .04em;
      color: #fff;
      text-shadow:
        0 0 18px rgba(51,255,51,.45),
        0 0 40px rgba(51,255,51,.18);
      user-select: none;
    }

    h1 .word {
      display: inline-block;
      white-space: nowrap;
    }

    .sub {
      margin-top: 22px;
      color: var(--green);
      letter-spacing: .28em;
      font-size: clamp(11px, 1.5vw, 16px);
      opacity: .9;
      text-transform: uppercase;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%);
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background: #062806;
      opacity: 0;
    }

    .flash.on {
      animation: jackin .55s ease-out forwards;
    }

    @keyframes jackin {
      0% { opacity: .55; }
      35% { opacity: .18; }
      100% { opacity: 0; }
    }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .45s ease;
      cursor: pointer;
      outline: none;
    }

    .gate span {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(28px, 4.2vw, 52px);
      letter-spacing: .42em;
      color: #1aff1a;
      text-shadow: 0 0 12px rgba(26,255,26,.35);
      transition: text-shadow .25s ease, transform .25s ease;
    }

    .gate:hover span,
    .gate:focus-visible span {
      text-shadow: 0 0 22px rgba(26,255,26,.75);
      transform: scale(1.05);
    }

    .gate.off {
      opacity: 0;
      pointer-events: none;
    }

    .gate.gone { display: none; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="gate" id="gate" role="button" tabindex="0" aria-label="Enter site"><span>ENTER</span></div>

  <main class="hero">
    <div class="hero-copy">
      <h1 aria-label="Secure Advanced Matrix">
        <span class="word" data-final="SECURE"></span>
        <span class="word" data-final="ADVANCED"></span>
        <span class="word" data-final="MATRIX"></span>
      </h1>
      <p class="sub">Availability · Confidentiality · Integrity</p>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    // Characters used in the falling rain. Repeating a character makes it appear more often.
    const glyphs =
      "010101010101010101" +         // bits (repeated so binary shows up most)
      "0123456789ABCDEF" +           // hex
      "GHIJKLMNOPQRSTUVWXYZ" +       // rest of the A–Z alphabet
      "<>{}[]/=+#$%&";               // code-style symbols
    const latin = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%";

    let w = 0, h = 0;
    let mode = "gate"; // gate -> rain
    const start = performance.now();
    const GATE_MS = 5000; // auto-enter after 5 seconds if nobody clicks

    let columns = 0;
    let drops = [];
    const fontSize = 16;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      columns = Math.ceil(w / fontSize);
      drops = Array.from({ length: columns }, () => Math.floor(Math.random() * h / fontSize));
    }

    // Fade out the ENTER screen (on click, key press, or timeout) — runs once
    const gate = document.getElementById("gate");
    function openGate() {
      if (mode !== "gate") return;
      gate.classList.add("off");
      setTimeout(() => gate.classList.add("gone"), 500);
      reveal();
    }
    gate.addEventListener("click", openGate);
    gate.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGate(); }
    });

    // Reveal the main page: flash, fade in headline, scramble the words
    function reveal() {
      mode = "rain";
      document.getElementById("flash").classList.add("on");
      document.body.classList.add("is-ready");
      document.querySelectorAll(".word").forEach((el, i) => {
        setTimeout(() => scrambleWord(el, el.dataset.final, 900 + i * 70), i * 110);
      });
    }

    function drawRain() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, w, h);
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < columns; i++) {
        const text = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
        ctx.fillStyle = Math.random() > 0.975 ? "#00aa33" : "#007a22";
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    function scrambleWord(el, final, duration = 1100) {
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - t0) / duration);
        const revealed = Math.floor(p * final.length);
        let out = "";
        for (let i = 0; i < final.length; i++) {
          out += i < revealed ? final[i] : latin[Math.floor(Math.random() * latin.length)];
        }
        el.textContent = out;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = final;
      }
      requestAnimationFrame(tick);
    }

    function loop(now) {
      if (mode === "gate") {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);
        if (now - start >= GATE_MS) openGate();
      } else {
        drawRain();
      }
      requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener("resize", resize);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
